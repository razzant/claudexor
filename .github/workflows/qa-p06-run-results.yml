name: qa p06 run-results qualification

# TEST-ONLY one-shot branch qualification of the P06 run-results and
# typed-refusal change, run BEFORE acceptance. NOT a product gate: it
# triggers only on a push to its own QA branch (no tags, no publish). The
# QA branch is the product branch plus test-only carrier commit(s) carrying
# this workflow and qa/p06/*; the public product branch and PR never contain
# these files. One GitHub-hosted Ubuntu runner, a read-only token, no
# secrets. Evidence uploads only with a successful final manifest AND a
# clean scanner, and an absent artifact set is reported, never an empty
# success.
#
# This carrier revision retains the existing exact product binding.
# Repeated fast-forward carrier revisions are fine: identity checks the
# product ancestry and the exact six-file difference, not a commit count.
# PRODUCT_BASE_SHA stays pinned here independently of any moving ref.
on:
  push:
    branches: [qa/p06-run-results]

permissions:
  contents: read

concurrency:
  group: qa-p06-run-results
  cancel-in-progress: false

env:
  # Public main sha the product branch started from (pinned independently;
  # never derived from HEAD~1 or any moving ref).
  PRODUCT_BASE_SHA: 5140960bb541002ea073b2eaeb064e3e48e829ea
  # Never defaults to HEAD~1: with repeated QA carrier commits HEAD~1 can
  # already be a previous carrier revision, not the product.
  PRODUCT_HEAD_SHA: "dfa8d9dc5e26231b28fdaa41adc0af3493eaa6ce"

jobs:
  qualify:
    name: P06 QA (ubuntu-latest)
    runs-on: ubuntu-latest
    # Bounded like the main CI jobs; release:verify:node runs the full node
    # battery, so keep headroom and raise this bound when honest runs near it.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the lanes resolve the pinned base sha,
          # the bound product sha and the nearest release tag from real refs.
          fetch-depth: 0

      # No `version:` — pnpm/action-setup reads `packageManager` (pnpm@10.34.5).
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up private scratch and the pinned offline publication scanner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stage=runner-scratch
          trap 'code=$?; printf "[p06] stage=%s exit=%d\n" "$stage" "$code"' EXIT
          mkdir -p "$RUNNER_TEMP/qa-p06" "$RUNNER_TEMP/qa-p06-run/logs"
          echo "QA_OUT=$RUNNER_TEMP/qa-p06" >> "$GITHUB_ENV"
          echo "QA_RUN=$RUNNER_TEMP/qa-p06-run" >> "$GITHUB_ENV"
          echo "QA_STORE=$RUNNER_TEMP/qa-p06-pnpm-store" >> "$GITHUB_ENV"
          scanner="$RUNNER_TEMP/qa-p06-run/tools/betterleaks"
          stage=scanner-provision
          node scripts/provision-betterleaks.mjs --dest "$scanner" > "$RUNNER_TEMP/qa-p06-run/logs/scanner-provision.log" 2>&1
          echo "CLAUDEXOR_BETTERLEAKS_PATH=$scanner" >> "$GITHUB_ENV"

      - name: Record exact tested tree and origin
        id: identity
        run: node qa/p06/run-qa.mjs identity

      - name: Generate on the product and export the allowlisted patch
        id: export
        run: node qa/p06/run-qa.mjs export

      - name: Install dependencies on the generated tree
        id: gen_install
        run: node qa/p06/run-qa.mjs install

      - name: Build fixture packages on the exact generated tree
        id: fixture_build
        run: node qa/p06/run-qa.mjs fixture-build

      - name: Emit synthetic 307/697 fixture bytes (loopback HTTP only, no live calls)
        run: node qa/p06/run-qa.mjs emit

      - name: Verify fixture completeness
        if: ${{ !cancelled() && steps.fixture_build.outcome == 'success' }}
        run: node qa/p06/run-qa.mjs verify-fixtures

      # The baseline needs only the identity; its result is independent of
      # exporting, building and testing the generated candidate.
      - name: Observe the unchanged baseline
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: node qa/p06/run-qa.mjs control-base

      - name: Observe the candidate independently of the baseline
        if: ${{ !cancelled() && steps.fixture_build.outcome == 'success' }}
        run: node qa/p06/run-qa.mjs control-candidate

      - name: Check affected user paths before the full gate
        # Builds the packages these tests import, so its result never depends
        # on how far release:verify:node gets.
        if: ${{ !cancelled() && steps.gen_install.outcome == 'success' }}
        run: node qa/p06/run-qa.mjs targeted

      - name: release:verify:node unmodified on the exact generated tree
        id: release
        # Runs whenever export bound the product SHA and produced the generated
        # tree — even if a fixture lane failed — so the artifact keeps both
        # outcomes instead of silently skipping the product verification.
        if: ${{ !cancelled() && steps.gen_install.outcome == 'success' }}
        run: node qa/p06/run-qa.mjs release

      - name: Identify late release failure from the existing log
        if: ${{ !cancelled() && steps.release.outcome == 'failure' }}
        run: |
          cause=$(LC_ALL=C awk '
            function mark(s) { if (f && f != s) conflict=1; f=s }
            { gsub(/\033\[[0-9;]*m/, ""); sub(/\r$/, "") }
            /^> claudexor-monorepo@/ { k=($3=="knip"); f=""; n=later=conflict=0; next }
            !k { next }
            /^Unused (files|dependencies|devDependencies|exports|exported types|exported enum members) \([1-9][0-9]*\)[[:space:]]*$/ { sub(/^[^(]*\(/, ""); n += $0+0; next }
            /^(complexity-ratchet|model-hints|mcp-cli-parity|artifact-text-parity-check|fixture-freshness)[: ]|^\{"(summary|harness)":/ { later=1 }
            /^complexity-ratchet FAILED:/         { mark("size") }
            /^model-hints (FAILURE:|self-test FAILED)/ { mark("model-hints") }
            /^\{"summary":\{"passed":[0-9]+,"skipped":[0-9]+,"failed":[1-9][0-9]*\}\}$/ { mark("harness-program") }
            /^mcp-cli-parity check FAILED:/       { mark("mcp-cli-parity") }
            /^artifact-text-parity-check FAILED/  { mark("artifact-text-parity") }
            /^fixture-freshness check FAILED:/    { mark("fixture-freshness") }
            END { if (k && !conflict && !n && f) print f; else if (k && n && !later) print "knip count=" n; else print "unknown" }
          ' "$QA_RUN/logs/release-verify.log" 2>/dev/null) || cause=unknown
          printf '[p06] late_cause=%s\n' "$cause"

      - name: Write the immutable final evidence manifest
        id: manifest
        if: always()
        run: node qa/p06/run-qa.mjs manifest

      - name: Check the selected synthetic evidence before upload
        id: safe_evidence
        if: always()
        # Resolve the scan root the same way as upload, not from an earlier
        # lane's environment. Neither scanner streams nor its report go there.
        env:
          QA_OUT: ${{ runner.temp }}/qa-p06
          QA_RUN: ${{ runner.temp }}/qa-p06-run
          CLAUDEXOR_BETTERLEAKS_PATH: ${{ runner.temp }}/qa-p06-run/tools/betterleaks
        run: node qa/p06/run-qa.mjs scan

      # QA_OUT holds only allowlisted selected evidence (identity, patch,
      # validated fixtures, control outcome hashes, release outcome, steps,
      # receipts, sanitized failure locations, final manifest); raw fixture
      # bytes and install/build/test logs stay in the runner scratch under
      # QA_RUN/logs and never enter the uploaded tree. Upload requires the
      # final manifest step AND the clean scanner to have succeeded; a missing
      # artifact set is an error, not an empty success.
      - name: Upload only checked evidence (requires successful manifest and clean scan)
        if: ${{ always() && steps.manifest.outcome == 'success' && steps.safe_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-p06-run-results
          path: ${{ runner.temp }}/qa-p06
          if-no-files-found: error
          retention-days: 30
