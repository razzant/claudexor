name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Each job is bounded at about twice its slowest successful run, never below
  # ten minutes, so a hung step fails visibly instead of holding a required
  # check for GitHub's six-hour default. Raise a bound when honest runs near it.
  build-test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.15.0, 24.22.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the concept gate range-walks the PR's constituent
          # commits (a shallow synthetic-merge checkout would hide them, and
          # the gate fails loudly on unreachable parents rather than skip).
          fetch-depth: 0

      # No `version:` here — pnpm/action-setup reads the `packageManager` field in package.json
      # (the pinned pnpm version). Specifying both causes
      # ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # The publication scan runs before any dependency install or lifecycle
      # step can read or echo repository contents. It is the same pinned
      # Betterleaks adapter `pr` delivery uses (INV-146), loaded from source
      # with Node's type stripping: the outgoing commit range (merges and commit
      # messages included) plus the complete tracked tree (attributes committed
      # in it do not apply; the runner's Git configuration does), live
      # validation off, findings by rule and place only.
      - name: Provision publication scanner (pinned Betterleaks)
        run: |
          node scripts/provision-betterleaks.mjs --dest "$RUNNER_TEMP/betterleaks/betterleaks"
          # Later test steps exercise the same pinned binary in `pr` delivery tests.
          echo "CLAUDEXOR_BETTERLEAKS_PATH=$RUNNER_TEMP/betterleaks/betterleaks" >> "$GITHUB_ENV"

      - name: Publication scan
        env:
          CLAUDEXOR_BETTERLEAKS_PATH: ${{ runner.temp }}/betterleaks/betterleaks
          SCAN_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/publication-scan.mjs --repo . --range "$SCAN_RANGE" --tree HEAD

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build Linux engine resources without platform helper substitutes
        if: matrix.node-version == '24.22.3'
        shell: bash
        env:
          CLAUDEXOR_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          resources="$RUNNER_TEMP/linux-engine-resources"
          bash scripts/build-engine-resources.sh "$resources"
          test ! -e "$resources/native"
          node "$resources/claudexord.bundle.cjs" --probe
          node "$resources/claudexor.bundle.cjs" help --json

          # Exercise the archive's materialized layout, not only deploy links.
          browser="$RUNNER_TEMP/linux-materialized-browser"
          node --input-type=module -e 'import { copyTreeMaterialized } from "./scripts/lib/remote-runtime-archive.mjs"; copyTreeMaterialized(process.argv[1], process.argv[2]);' "$resources/browser-mcp-runtime" "$browser"
          node "$browser/dist/browser-mcp-launcher.js" --help

      - name: Typecheck (packages + tests + scripts)
        run: pnpm typecheck && pnpm typecheck:tests

      # Bounded inside the job, so the listing below still runs after a hang.
      - name: Test
        id: test
        timeout-minutes: 40
        run: pnpm test

      - name: List processes left after the test step failed or timed out
        if: failure() && steps.test.outcome == 'failure'
        run: ps axww -o user,pid,ppid,pgid,stat,etime,command | awk -v user="$(id -un)" 'NR == 1 || $1 == user'

      - name: Verify generated JSON Schema is up to date
        run: |
          pnpm schema:gen
          git diff --exit-code packages/schema/generated || (echo "::error::JSON Schema is stale; run 'pnpm schema:gen' and commit." && exit 1)
          if [ -n "$(git ls-files --others --exclude-standard packages/schema/generated)" ]; then
            echo "::error::Untracked generated schema files exist; commit them."
            exit 1
          fi

      - name: Validate generated JSON Schema dialect (ajv)
        run: node scripts/validate-generated-schemas.mjs

      - name: Docs truth (endpoints, mode ids, CLI flags)
        run: node scripts/docs-truth-check.mjs

      - name: Concept gate (Bible edits need CONCEPT-CHANGE markers)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Checkout is fetch-depth: 0, so ranges walk real constituent
          # commits (synthetic PR merges are exempt unless they change the
          # Bible beyond their parents; the gate handles that itself).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git check-ref-format --branch "$BASE_REF" >/dev/null
            git fetch --no-tags origin "$BASE_REF"
            node scripts/concept-gate.mjs --range "origin/$BASE_REF..HEAD"
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            node scripts/concept-gate.mjs --range "$BEFORE_SHA..HEAD"
          else
            node scripts/concept-gate.mjs --since-last-tag
          fi

      - name: Staged-field gate (schema fields need producer+consumer)
        run: pnpm staged:check

      - name: Retired-key gate (persisted-config removals need a registry entry)
        run: pnpm retired:check

      - name: "INV→verify link gate (every Bible verify: target exists and runs)"
        run: pnpm inv:check

      - name: Swift fixtures freshness (TS↔Swift round-trip fixtures in sync)
        run: pnpm fixtures:swift:check

      - name: Sensitive-resource ownership gate
        run: pnpm sensitive:check

      - name: Dead exports (knip)
        run: pnpm knip

      - name: Complexity ratchet (readability only goes up)
        run: node scripts/complexity-ratchet.mjs

      - name: Model-hints freshness (manifest known_models vs installed CLIs)
        run: node scripts/model-hints-freshness.mjs

      - name: MCP-CLI capability parity (tool args vs run-control flags)
        run: node scripts/mcp-cli-parity-check.mjs

      - name: Artifact text-extension parity (server SEMANTIC_TEXT_EXTENSIONS vs Swift)
        run: node scripts/artifact-text-parity-check.mjs

      - name: Fixture provenance (manifest coverage; freshness warns locally)
        run: node scripts/fixture-freshness-check.mjs

      - name: Runtime-update fixtures freshness (signed-manifest test vectors)
        run: pnpm fixtures:runtime-update:check

      - name: Canary golden stories (fake-harness E2E)
        run: pnpm canary

      - name: Release workflow supply-chain contract
        run: pnpm release:workflow:check

      - name: Format
        run: pnpm format:check

      - name: Linux CLI smoke (bins, machine surfaces, doctor honesty)
        shell: bash
        run: |
          set -euo pipefail
          # The bare-package wrapper bins must run on Linux.
          node packages/claudexor/bin/claudexor.js --version
          node packages/claudexor/bin/claudexor.js help --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok||!Array.isArray(j.commands))process.exit(1);});'
          node packages/cli/dist/cli.js capabilities --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.ok!==true)process.exit(1);});'
          # No vendor CLIs on the runner: doctor must report them honestly
          # (unavailable/degraded) as VALID JSON — a crash or empty output
          # fails this step loudly (no || true escape hatch).
          node packages/cli/dist/cli.js doctor --json > /tmp/doctor.json
          node -e 'const j=JSON.parse(require("node:fs").readFileSync("/tmp/doctor.json","utf8")); if(!Array.isArray(j.harnesses)) { console.error("doctor --json did not produce a harnesses array"); process.exit(1); }'

      - name: Setup unsupported Node for typed-refusal proof
        if: matrix.node-version == '24.15.0'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.19.0

      - name: Refuse an unsupported store runtime before opening its root
        if: matrix.node-version == '24.15.0'
        run: pnpm vitest run packages/daemon/src/store/runtime.test.ts

  # Branch protection on main requires a check context literally named
  # `build-test`. The job above never publishes one: a matrix job's check runs
  # are named from its `name:` template, so it reports as "Node 24.15.0" and
  # "Node 24.22.3" and the required context stays pending forever (every PR
  # sits at BLOCKED). This aggregate exists only to publish that name.
  # `if: always()` is load-bearing — without it the job is skipped when the
  # matrix fails or is cancelled, and a skipped required check never reports.
  build-test-gate:
    name: build-test
    needs: [build-test, windows-test, swift, vendor-programs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every Node matrix leg to succeed
        # `needs.<job>.result` collapses the whole matrix: it is `success` only
        # when every leg succeeded (fail-fast: false means all of them ran).
        env:
          MATRIX_RESULT: ${{ needs.build-test.result }}
          WINDOWS_RESULT: ${{ needs.windows-test.result }}
          MACOS_RESULT: ${{ needs.swift.result }}
          VENDOR_RESULT: ${{ needs.vendor-programs.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Node matrix result is '$MATRIX_RESULT' (expected 'success')."
            exit 1
          fi
          if [ "$WINDOWS_RESULT" != "success" ]; then
            echo "::error::Windows lane result is '$WINDOWS_RESULT' (expected 'success')."
            exit 1
          fi
          if [ "$MACOS_RESULT" != "success" ]; then
            echo "::error::macOS lane result is '$MACOS_RESULT' (expected 'success')."
            exit 1
          fi
          if [ "$VENDOR_RESULT" != "success" ]; then
            echo "::error::Vendor program result is '$VENDOR_RESULT' (expected 'success')."
            exit 1
          fi

  windows-test:
    name: Windows ${{ matrix.runner }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            node-version: 24.15.0
          - runner: windows-latest
            node-version: 24.22.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Initialize pinned x64 MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe is unavailable on the hosted Windows image"
          }
          $installation = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1).Trim()
          if (-not $installation) { throw "x64 MSVC build tools are unavailable" }
          $devCmd = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $devCmd -PathType Leaf)) {
            throw "VsDevCmd.bat is unavailable at $devCmd"
          }
          $setup = Join-Path $env:RUNNER_TEMP "claudexor-msvc-env.cmd"
          "@call `"$devCmd`" -no_logo -arch=x64 -host_arch=x64`r`n@set`r`n" |
            Set-Content -LiteralPath $setup -Encoding ascii
          $developer = @{}
          & $env:ComSpec /d /s /c "`"$setup`"" | ForEach-Object {
            $separator = $_.IndexOf("=")
            if ($separator -gt 0) {
              $developer[$_.Substring(0, $separator)] = $_.Substring($separator + 1)
            }
          }
          foreach ($name in @("Path", "INCLUDE", "LIB", "LIBPATH", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion", "UCRTVersion")) {
            if ($developer.ContainsKey($name)) {
              Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$($developer[$name])" -Encoding utf8
            }
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build native ConPTY fixture
        run: pnpm --filter @claudexor/core build:win32-fixtures

      # The Windows-shaped surfaces, and only suites whose fixtures are
      # portable: the absolute-path contract, win32 process identity and
      # termination, and the legacy reader whose separator bug reproduces
      # ONLY here. Suites built on POSIX mode bits, symlinks or `#!/bin/sh`
      # fixtures stay on the Linux/macOS legs; their win32 branches are
      # proven by injected-platform unit tests instead. The CLI exit tail runs
      # here because only Windows libuv aborts a forced exit after fetch(). The
      # release smoke's daemon stop loop runs under this runner's pwsh.
      - name: Test (platform auth, agy print, ConPTY, setup transport, SQL recovery, CLI exit)
        run: >
          pnpm vitest run packages/schema/src/schema.test.ts
          packages/schema/src/platform-auth-policy.test.ts
          packages/core/src/process-identity.test.ts
          packages/core/src/process-tree.test.ts
          packages/core/src/proc-windows-hide.test.ts
          packages/core/src/capabilities.test.ts
          packages/core/src/win32-conpty-helper.test.ts
          packages/harness-agy/src/conformance.test.ts
          packages/harness-agy/src/win32-print-acceptance.test.ts
          packages/cli/src/setup-login-capability.test.ts
          packages/cli/src/setup-login-pty.test.ts
          packages/cli/src/setup-login-runner-transport.test.ts
          packages/cli/src/profile-login-win32.integration.test.ts
          packages/cli/src/setup-login-recovery.test.ts
          packages/cli/src/setup-recovery-command.test.ts
          packages/cli/src/live-auth-status.test.ts
          packages/core/src/credential-mutation-window.test.ts
          packages/core/src/proc-exit.test.ts
          packages/harness-cursor/src/auth-timeout.test.ts
          packages/harness-cursor/src/status-cache.test.ts
          packages/harness-cursor/src/status-cache-clock.test.ts
          packages/cli/src/cli-io.test.ts
          packages/daemon/src/store/store.test.ts
          packages/daemon/src/store/runtime.test.ts
          packages/daemon/src/store/schema.test.ts
          packages/daemon/src/store/flusher.test.ts
          packages/daemon/src/store/external-files.test.ts
          packages/daemon/src/store/blob-files.test.ts
          packages/daemon/src/store/obligations.test.ts
          packages/daemon/src/store/maintenance.test.ts
          packages/daemon/src/store/retention.test.ts
          packages/daemon/src/store/cursors.test.ts
          packages/daemon/src/store/main-thread-sync.test.ts
          packages/cli/src/store-worker-bundle.test.ts
          packages/cli/src/bulk-worker-bundle.test.ts
          packages/control-api/src/bulk-executor.test.ts
          packages/control-api/src/bulk-worker-isolation.test.ts
          packages/control-api/src/event-replay-batch.test.ts
          packages/event-log/src/live-seq.test.ts
          packages/daemon/src/store/legacy-journal/frame-reader.test.ts
          packages/daemon/src/store/legacy-journal/frame-reader-shrink.test.ts
          packages/daemon/src/store/command-contract.test.ts
          packages/daemon/src/store/terminal-contract.test.ts
          packages/daemon/src/store/import-faults.test.ts
          packages/daemon/src/store/engine-state-recovery.test.ts
          packages/daemon/src/store/sql-recovery.test.ts
          packages/daemon/src/store/store-close.test.ts
          packages/daemon/src/store/statement-observer.test.ts
          packages/cli/src/sql-startup-storage.test.ts
          packages/cli/src/sql-daemon-storage.test.ts
          packages/cli/src/sql-daemon-storage-owner.test.ts
          packages/harness-codex/src/model-auth.test.ts
          packages/harness-codex/src/model.test.ts
          packages/harness-codex/src/responses.test.ts
          packages/daemon/src/model-operations.test.ts
          packages/control-api/src/files-result.test.ts
          packages/workspace/src/directory-portable.test.ts
          packages/daemon/src/resource-store.model.test.ts
          packages/daemon/src/command-retention.test.ts
          packages/control-api/src/model-routes.test.ts
          scripts/lib/release-windows-stop.test.mjs

      # Default-path writer birth: real FILETIME reads, an owned witness process
      # and the built daemon on its default named pipe. The mismatched record is
      # seeded and labelled synthetic; nothing forces real PID recycling. Kept
      # apart from the parallel step above so its timing line reads this lane's
      # own PowerShell and stop latency. That line is an observation, not a gate.
      - name: Writer birth identity and built daemon lifecycle (credential-free native processes)
        run: >
          pnpm vitest run packages/daemon/src/writer-lease-pid-reuse.test.ts
          packages/cli/src/claudexord-writer-birth.test.ts

      - name: Reproduce Codex cleanup control loss on the known broken control (Windows, no credentials)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/windows-codex-verdict-1755'
        shell: pwsh
        env:
          CLEANUP_BASE_SHA: 211a8f52acbde19803e9104960639c903c54f752
        run: |
          $ErrorActionPreference = "Stop"
          $source = (Get-Location).Path
          $baseline = Join-Path $env:RUNNER_TEMP "codex-cleanup-base"
          git fetch --no-tags origin $env:CLEANUP_BASE_SHA
          if ($LASTEXITCODE -ne 0) { throw "base fetch failed" }
          git worktree add --detach $baseline $env:CLEANUP_BASE_SHA
          if ($LASTEXITCODE -ne 0) { throw "base checkout failed" }
          foreach ($file in @("packages/harness-codex/src/app-server-cleanup-native.test.ts", "packages/harness-codex/fixtures/app-server/cleanup-peer.mjs")) {
            Copy-Item -LiteralPath (Join-Path $source $file) -Destination (Join-Path $baseline $file)
          }
          Push-Location $baseline
          try {
            pnpm install --frozen-lockfile --offline
            if ($LASTEXITCODE -ne 0) { throw "base dependency setup failed" }
            pnpm build
            if ($LASTEXITCODE -ne 0) { throw "base build failed" }
            $env:CX_CLEANUP_BASELINE = "1"
            Write-Output "Native baseline subject: $env:CLEANUP_BASE_SHA; expected control loss, not repaired behavior"
            pnpm vitest run packages/harness-codex/src/app-server-cleanup-native.test.ts
            if ($LASTEXITCODE -ne 0) { throw "expected baseline failure signature not reproduced" }
          } finally {
            Remove-Item Env:CX_CLEANUP_BASELINE -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: Codex completed-answer and cleanup boundary (credential-free native processes)
        run: >
          pnpm vitest run packages/harness-codex/src/app-server-cleanup.test.ts
          packages/harness-codex/src/app-server-cleanup-native.test.ts
          packages/orchestrator/src/codex-cleanup-review.test.ts

      - name: Exercise SQLite writers, flush barriers and maintenance together
        shell: pwsh
        env:
          RATE: "200"
          K: "2"
          SECONDS: "3"
          OUT: ${{ runner.temp }}/claudexor-store-load.jsonl
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/store-load-bench.mjs
          if ($LASTEXITCODE -ne 0) { throw "store-load-bench exited $LASTEXITCODE" }
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const r=JSON.parse(readFileSync(process.env.OUT,"utf8").trim().split("\n").at(-1)); if(r.integrity?.ok!==true || !(r.flusher.counters.barriers>0) || !(r.flushed?.n>0)) throw new Error("store load smoke did not prove integrity and flush completion");'
          if ($LASTEXITCODE -ne 0) { throw "store load smoke did not pass" }

      # The same real-vendor proof as the `vendor-programs` job, here because
      # the Windows build needs this job's MSVC environment. One runner is enough.
      # All phases share its actual Windows profile: winget/MSI do not honor a fake HOME.
      - name: Vendor installation, update and npm-copy replacement routes
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/vendor-program-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw "vendor program smoke exited $LASTEXITCODE" }

  # Real vendor installers and updaters in a disposable HOME on each platform:
  # every adapter-declared installation route, the installed program's own
  # update, and replacement of a product-made npm copy. Receipts and the next
  # resolver read must agree on the program path and its own version;
  # auth/model compatibility is separate.
  vendor-programs:
    name: Vendor programs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Vendor installation, update and npm-copy replacement routes
        run: node scripts/vendor-program-smoke.mjs

  swift:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build and probe engine resources independently of the app
        shell: bash
        env:
          CLAUDEXOR_BUILD_SHA: ${{ github.sha }}
          # Stage, sign-free provenance and the offline version probe of the
          # bundled darwin publication scanners are part of this build.
          CLAUDEXOR_REQUIRE_BETTERLEAKS: "1"
        run: |
          set -euo pipefail
          resources="$RUNNER_TEMP/engine-resources"
          bash scripts/build-engine-resources.sh "$resources"
          node "$resources/claudexord.bundle.cjs" --probe
          node "$resources/claudexor.bundle.cjs" help --json
          pnpm vitest run packages/core/src/process-identity.test.ts packages/schema/src/platform-auth-policy.test.ts

      - name: Verify local macOS app signing, cleanup and boot smoke
        run: pnpm vitest run scripts/lib/build-app-local-signing.test.mjs scripts/lib/build-app-cleanup.test.mjs scripts/lib/build-app-boot-smoke.test.mjs

      - name: Swift tests (ClaudexorKit)
        working-directory: apps/macos/ClaudexorKit
        run: swift test

      - name: Swift tests and build (ClaudexorApp)
        working-directory: apps/macos/ClaudexorApp
        run: swift test && swift build
