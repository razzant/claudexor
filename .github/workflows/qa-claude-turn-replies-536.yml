name: Claude turn replies — isolated Node verification

on:
  push:
    branches: [qa/verify-claude-turns-b6d46f16]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b4cf9dc80eb738fa2cdb570dd564c4b782e8cc1d
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact product checkout
        run: |
          test "$(git rev-parse HEAD)" = b4cf9dc80eb738fa2cdb570dd564c4b782e8cc1d
          test "$(git rev-parse 'HEAD^{tree}')" = 773970d6341f3f2d989e9d1b8fad05e549c9cfb1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Prepare pinned publication scanner
        run: |
          node scripts/provision-betterleaks.mjs --dest "$RUNNER_TEMP/betterleaks/betterleaks"
          echo "CLAUDEXOR_BETTERLEAKS_PATH=$RUNNER_TEMP/betterleaks/betterleaks" >> "$GITHUB_ENV"
      - name: Scan the outgoing commit and product tree
        run: node scripts/publication-scan.mjs --repo . --range 8210f1880aeffd49352af154db252617b7d34a6f..b4cf9dc80eb738fa2cdb570dd564c4b782e8cc1d --tree HEAD
      - run: pnpm install --frozen-lockfile
      - name: Run the complete contributor gate
        run: pnpm release:verify:node
