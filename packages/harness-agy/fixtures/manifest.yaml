# The separate models.tsv is recorded stdout from `agy models`, 2026-10-03.
# Its command exited 0; "Fetching available models..." was stderr. The CLI
# reported 1.1.13 before this listing and self-updated to 1.2.16 during it.
# Exact serving version is therefore unknown; this fixture proves only the
# two-column table shape and presence for that account at that time, not a
# refreshed 1.1.13 stream/transport proof. No fixture pin was moved.
#
# Fixture provenance manifest. basic-run, schema-envelope-run and error-auth
# were RECORDED from live authenticated agy 1.1.13 sessions on macOS
# (2026-08-16). session-resume.jsonl (a resumed conversation was not captured)
# and fragment-error-run.jsonl are synthesized from those exact recorded
# shapes. Host paths are scrubbed to a
# neutral /workspace/demo root and the init tool inventory is trimmed to the
# fields the parser reads — the event SHAPES are verbatim.
#
# basic-run.jsonl is the PRODUCTION path: no --json-schema (the adapter never
# passes one and declares json_schema_output false), so its typed final comes
# from `result.response` with final_source "result".
# schema-envelope-run.jsonl is a SECOND capture taken WITH a WorkReport-shaped
# --json-schema. It is not reachable through the shipped adapter today; it
# pins the structured_output branch for the day the owner enables the
# constrained transport (PLAN Л-31 / §1.2e, which also records that the
# envelope costs an extra vendor turn).
#
# `expectations` (W3.8) are the STREAM SEMANTICS the conformance test asserts
# through core streamExpectationViolations. agy HAS a typed final: the terminal
# `result` event — finality never comes from mid-run narration.
#
# `delta_messages` is DERIVED from the parser, not from the recordings: the
# parser types every `text_delta` as a non-final stream fragment
# (payload.delta), because retained tries show each typed final equal to the
# exact concatenation of its narration frames. The recorded bytes, dates and
# CLI version below are unchanged; only these derived counts moved from 0 to
# the number of text_delta frames each stream carries (basic-run 1,
# schema-envelope-run 2, session-resume 1). No newer CLI version is claimed.
cli: agy
fixtures:
  basic-run.jsonl:
    source: recorded
    cli_version: 1.1.13
    recorded_at: "2026-08-16"
    sanitized: true
    expectations:
      final_messages: 1
      final_source: result
      final_is_last_message: true
      started_events: 1
      thinking_events: 0
      delta_messages: 1
      typed_rate_limit: false
  schema-envelope-run.jsonl:
    source: recorded
    cli_version: 1.1.13
    recorded_at: "2026-08-16"
    sanitized: true
    expectations:
      final_messages: 1
      final_source: structured_output
      final_is_last_message: true
      started_events: 1
      thinking_events: 0
      delta_messages: 2
      typed_rate_limit: false
  error-auth.jsonl:
    source: recorded
    cli_version: 1.1.13
    recorded_at: "2026-08-16"
    sanitized: true
    expectations:
      final_messages: 0
      final_is_last_message: false
      started_events: 0
      thinking_events: 0
      delta_messages: 0
      typed_rate_limit: false
  session-resume.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: result
      final_is_last_message: true
      started_events: 1
      thinking_events: 0
      delta_messages: 1
      typed_rate_limit: false
  # SYNTHETIC, not a recording of any CLI version: the recorded init/step/tool
  # shapes above with text split into fragments (a whitespace-only frame and a
  # repeated frame included) around a tool step, ending in the ERROR envelope
  # shape of error-auth.jsonl with a non-empty response. Neutral fixture text.
  fragment-error-run.jsonl:
    source: synthetic
    expectations:
      final_messages: 0
      final_is_last_message: false
      started_events: 1
      thinking_events: 0
      delta_messages: 8
      typed_rate_limit: false

# Already-normalized historical events live separately under
# src/test-support/normalized with their own provenance, not a vendor stream pin.
