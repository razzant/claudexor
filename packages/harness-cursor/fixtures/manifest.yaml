# Fixture provenance manifest. Recorded streams are sanitized: request/session
# ids, timestamps, paths, model narration, and tool payload contents are replaced
# with neutral placeholders while frame types, shapes, and ordering stay intact.
#
# `expectations` (W3.8) are the STREAM SEMANTICS the conformance test asserts
# through core streamExpectationViolations. Cursor emits NO typed rate-limit
# frame on the wire; since A1 the adapter classifies the vendor's usage-limit
# PROSE (stream `error` frames, failed results, and the stderr fatal) into the
# typed `rate_limit` signal — see signals/usage-limit-error.jsonl. Other
# transient conditions still surface as generic errors.
cli: cursor
fixtures:
  basic-run.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      thinking_events: 0
      delta_messages: 0
      tool_error_results: 2
      typed_rate_limit: false
  session-resume.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      thinking_events: 0
      delta_messages: 0
      typed_rate_limit: false
  # Synthetic text values exercise word/whitespace boundaries over the native
  # thinking frame shape in the recorded plan fixtures. Assistant frames use
  # the existing stream-partial-output delta/buffered/complete taxonomy.
  stream/text-deltas.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      thinking_events: 4
      delta_messages: 2
      tool_error_results: 0
      typed_rate_limit: false
  # Plan-mode createPlan recovery fixtures (Defect 1). Replayed with planMode=true
  # by src/plan.test.ts, NOT by the root conformance loop (which is agent-mode).
  plan/plan-empty-uri-inline.jsonl:
    source: synthetic
  plan/plan-valid-uri.jsonl:
    source: synthetic
  plan/plan-no-plan.jsonl:
    source: synthetic
  plan/plan-ask-workreport-recorded.jsonl:
    source: recorded
    cli_version: "2026.08.11-e8db854"
    recorded_at: "2026-08-13"
    sanitized: "ids, timestamps, paths, narration, tool payload contents"
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      thinking_events: 9
      delta_messages: 0
      tool_error_results: 0
      typed_rate_limit: false
  plan/plan-ask-permission-denied-recorded.jsonl:
    source: recorded
    cli_version: "2026.08.11-e8db854"
    recorded_at: "2026-08-14"
    capture: "direct Cursor Ask stream; one harmless Shell request denied before execution"
    sanitized: "ids, timestamps, paths, command/error/narration values, tool payload contents"
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      thinking_events: 10
      started_events: 1
      delta_messages: 0
      tool_error_results: 0
      typed_rate_limit: false
  # Defensive shape: Ask does not normally emit createPlan, but a stale/vendor
  # frame must never outrank the final model-authored WorkReport.
  plan/plan-ask-createplan-precedence.jsonl:
    source: synthetic
  # Shell COMMAND OUTCOMES (#450): exit 0, exit 1, a background handoff after
  # the 30 s timeout, a requested background handoff, a timeout without an
  # observed end, an abort after a timeout, and a spawn error. Synthetic: no
  # Cursor timeout or background result has been recorded. Field names follow
  # the agent.v1 ShellResult/ShellSuccess/ShellFailure/ShellTimeout/
  # ShellSpawnError definitions in cursor-agent 2026.08.11-e8db854, serialized
  # as its stream-json writer does (JSON.stringify of protobuf-es messages, so
  # default values such as exitCode 0 are present). That CLI builds the
  # requested-background and timeout results locally; the timeout-driven
  # background result is assembled elsewhere, so its exact frame is unverified.
  # Replayed by src/shell-outcome.test.ts, NOT by the root conformance loop.
  shell/command-outcomes.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      tool_error_results: 3
      typed_rate_limit: false
  # Background completion notifications (#546). NATIVE-SHAPED, not a raw
  # recording: frames follow the sanitized excerpt of one cursor-agent
  # 2026.08.11-e8db854 print-mode run in razzant/claudexor#546 (a foreground
  # command its 30 s timeout moved to the background, with the result-level
  # `isBackground: false`; a requested background command; one
  # `system/task_notification` per shell whose `task_id` is that result's
  # `shellId`, status `success`, no exit code) and that build's stream-json
  # writer. The raw frames were not shared, so the shape stays a hypothesis
  # until a sanitized recording replaces this file. Ids, paths, timestamps and
  # narration are placeholders. Replayed by src/background-completion.test.ts
  # and the orchestrator integration test, NOT by the root conformance loop.
  shell/background-completion.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      tool_error_results: 0
      typed_rate_limit: false
  # Negative and unreadable reports (#546). SYNTHETIC, weaker than the file
  # above: no native run showed these frames. `error` (with `detail:
  # "exit_code=1"`) and `aborted` come only from a static reading of that build's
  # stream-json writer and shell-completion code, and the `task_progress` id
  # likewise. `paused` is INVENTED as a negative control: no source defines it,
  # so its shell must stay a handoff. The repeated `error` frame is a duplicate.
  shell/background-completion-failures.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "assistant_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      tool_error_results: 0
      typed_rate_limit: false
  # A1 TYPED VENDOR-LIMIT EVIDENCE. Lives in signals/ (NOT top-level) because
  # the top-level conformance loop asserts tool/usage shapes on every fixture
  # and a limit-killed run has none — replayed by src/signals.test.ts against
  # these expectations instead. The error prose is the VERBATIM live incident
  # stderr (2026-08-17, run-2a6fcadecb03: `ActionRequiredError: You've hit
  # your usage limit … resets … on 9/12/2026`), replayed as a stream `error`
  # frame; the same prose drives the parseCursorStderrFailure unit tests.
  # Synthetic because the incident's prose arrived on stderr, not as a
  # recorded stream frame.
  signals/usage-limit-error.jsonl:
    source: synthetic
    expectations:
      final_messages: 0
      final_is_last_message: false
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      tool_error_results: 0
      typed_rate_limit: true
      retry_class: "rate_limit"
