# Fixture provenance manifest. Every stream fixture declares its source;
# recorded fixtures carry the vendor CLI version they were captured from so
# scripts/fixture-freshness-check.mjs can warn when the installed CLI has
# moved on (stale recordings are a freshness smell, not a build breaker).
# Recorded fixtures are SANITIZED: request/message ids, thinking signatures,
# and the recording machine's environment fingerprint (installed skills /
# slash commands / agents / plugins / memory and output-style paths) are
# replaced with neutral placeholders;
# frame shapes and event ordering are untouched.
# The 2.1.281 help capture is help-2.1.281.txt. Controlled endpoint recordings
# below use the unmodified native CLI with public synthetic inputs, local
# Anthropic-compatible responses, and synthetic local auth markers. The CLI
# itself emits every recorded stdout frame; these probes make no vendor call.
#
# `expectations` (W3.8) are the STREAM SEMANTICS the conformance test asserts
# through core streamExpectationViolations — exact counts on a deterministic
# fixture pin the finality/dedup/delta/lifecycle regression classes.
# `final_source` is the MACHINE-checked identity of the wire event finality
# came from (the adapter stamps payload.final_source on final messages).
cli: claude
fixtures:
  basic-run.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "result"
      final_is_last_message: true
      thinking_events: 0
      delta_messages: 0
      typed_rate_limit: false
  plan-progress-task-tools.jsonl:
    source: synthetic
    expectations:
      # The result frame carries usage but NO result text — an absent final
      # is the honest outcome, never invented from narration.
      final_messages: 0
      # No final here (the result frame carries no text): source unasserted.
      final_is_last_message: false
      thinking_events: 0
      delta_messages: 0
      typed_rate_limit: false
  stream-deltas.jsonl:
    source: synthetic
    expectations:
      # 3 main-conversation text deltas surface flagged; the subagent delta
      # (parent_tool_use_id) and message_start plumbing never surface.
      final_messages: 1
      final_source: "result"
      final_is_last_message: true
      thinking_events: 0
      delta_messages: 3
      typed_rate_limit: false
  recorded-real-cli.jsonl:
    source: recorded
    cli_version: "2.1.281"
    recorded_at: "2026-09-24"
    capture: "controlled loopback Messages endpoint; native Read missing file, Read existing file, final result"
    sanitized: "ids, signatures, environment fingerprint"
    expectations:
      final_messages: 1
      final_source: "result"
      final_is_last_message: true
      thinking_events: 0
      delta_messages: 0
      typed_rate_limit: false
  session-resume-rate-limit.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "result"
      final_is_last_message: true
      # The vendor sends PROSE ("rate_limit_error: Number of request tokens
      # has exceeded..."). Since F5 the mapper classifies that prose onto the
      # documented categories (bare labels still accepted; unrecognized still
      # collapses to "unknown") — this declaration moved "unknown" →
      # "rate_limit" deliberately with that change.
      retry_class: "rate_limit"
      thinking_events: 0
      delta_messages: 0
      typed_rate_limit: true
  protocol/control-handshake.jsonl:
    source: recorded
    cli_version: "2.1.281"
    recorded_at: "2026-09-24"
    capture: "controlled loopback Messages endpoint; native AskUserQuestion with stdio permission round trip"
    sanitized: "ids, signatures, environment fingerprint"
    expectations:
      # An AskUserQuestion round trip over the control protocol. What this pins:
      # the control frames themselves (control_response / control_cancel_request)
      # are recognized plumbing and leak NOTHING into the timeline — the only
      # events are the session's own (started, the AskUserQuestion tool pair,
      # the answer, usage, and the terminal result). 2.1.281 also emits a
      # system/informational notice here because the loopback base URL is a
      # non-first-party gateway; system frames are recognized plumbing.
      final_messages: 1
      final_source: "result"
      final_is_last_message: true
      thinking_events: 0
      delta_messages: 0
      typed_rate_limit: false
  # BINARY-ONLY PICKER CAPTURE (claude 2.1.280, 2026-09-24). ONE stdout line:
  # the CLI's answer to the prompt-free `initialize` control_request the model
  # probe sends (src/model-probe.ts), parsed by model-probe.test.ts alongside
  # the API-key handshake above (2.1.281; its line 3 carries a 6-row picker).
  # Declared `synthetic`, NOT `recorded`, ON PURPOSE: the strict vendor gate
  # (`release:verify:vendors`) compares every recorded fixture with the ONE
  # installed CLI, and this package's recordings are pinned to 2.1.281 (the
  # paid-subscription capture stays 2.1.261) — a
  # second recorded cli_version can never be fresh on one release machine.
  # Its real provenance is stated in `capture` instead.
  protocol/initialize-picker-2.1.280.jsonl:
    source: synthetic
    capture: "claude 2.1.280 (native installer), argv: -p --input-format stream-json --output-format stream-json --verbose --setting-sources '' --strict-mcp-config (never --model); stdin = one initialize control_request then EOF; scratch HOME + CLAUDE_CONFIG_DIR; CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1; logged out (account.tokenSource none, apiProvider firstParty); exit 0 in 0.2 s"
    sanitized: "pid, commands/agents inventories (the CLI's bundled-skill fingerprint), output-styles path; models/account/flags untouched"
    # Re-probed 2026-09-24 with a scratch npm install of 2.1.281 (same argv,
    # same scratch scope): identical five rows, resolutions and response keys,
    # so this capture stands for the managed pin too.
  # D-16 TYPED-SIGNAL EVIDENCE (claude 2.1.281 controlled-endpoint probes; the
  # live-subscription capture stays 2.1.261). These live in signals/ (NOT
  # top-level) on purpose: the top-level conformance loop asserts
  # tool_call/tool_result/error/usage on every fixture, while these captures
  # target individual lifecycle and quota signals. They carry no `expectations`
  # block (not consumed by the loop, only by the freshness/provenance gate).
  # Sanitized like the other recorded fixtures: ids, signatures, and the
  # environment fingerprint (skills / slash commands / plugins / memory paths /
  # cwd) are neutral placeholders; the SIGNAL-bearing fields
  # (rate_limit_info, terminal_reason, api_error_status, usage) are UNTOUCHED.
  #
  # LIVE SUBSCRIPTION. Fable 5.1 at max effort reads a public numbers.json and
  # returns its sum through the production adapter. Native result carries
  # terminal_reason:"completed" and full usage/modelUsage; routine allowed
  # rate_limit_event frames include the current unifiedWindows telemetry.
  # NOT re-recorded for the 2.1.281 pin: a fresh capture needs a paid live
  # subscription run, so it keeps the version it was actually captured from.
  signals/terminal-completed-rate-limit-event.jsonl:
    source: recorded
    cli_version: "2.1.261"
    recorded_at: "2026-09-05"
    sanitized: "ids, environment fingerprint"
  # CONTROLLED ENDPOINT. Current CLI converts 7d utilization, reset, and
  # surpassed-threshold headers into this native allowed_warning frame. A
  # synthetic local OAuth marker selects the subscription header decoder;
  # no real credential or vendor quota is used. This proves the advisory
  # heartbeat must not arm account cooldown or profile rotation.
  signals/allowed-warning-rate-limit-event.jsonl:
    source: recorded
    cli_version: "2.1.281"
    recorded_at: "2026-09-24"
    sanitized: "ids"
  # CONTROLLED ENDPOINT. An interactive native session loads a local stdio
  # server named claudexor whose initialize response is delayed three seconds.
  # The 2.1.261 and 2.1.281 probes wait for handshake and emit connected (2.1.281
  # adds the receipt's `source: "dynamic"` for an --mcp-config server). The historical
  # 2.1.165 pending frame remains an explicit inline regression in signals.test.ts;
  # this current recording does not claim that pending is impossible.
  signals/required-mcp-connected.jsonl:
    source: recorded
    cli_version: "2.1.281"
    recorded_at: "2026-09-24"
    sanitized: "ids, environment fingerprint"
  # CONTROLLED ENDPOINT. A local HTTP 400 invalid_request_error reports a
  # prompt-too-long error. Native CLI generates the assistant error and
  # is_error result with terminal_reason:"prompt_too_long", api_error_status:400,
  # zero cost, and empty modelUsage. This pins error conversion, not a measured
  # Fable 5.1 context ceiling; the request and the reported sizes are synthetic.
  signals/terminal-prompt-too-long.jsonl:
    source: recorded
    cli_version: "2.1.281"
    recorded_at: "2026-09-24"
    sanitized: "ids, environment fingerprint"
  # SYNTHETIC — to be replaced at the next paid smoke that trips a real
  # auto-compaction. A cheap live compact_boundary was not reachable (a
  # single-exchange -p run cannot be compacted; stuffing context to the
  # auto-compact threshold is the expensive path D-16 explicitly avoids).
  # Shape follows the official Agent SDK contract:
  #   {type:"system", subtype:"compact_boundary",
  #    compact_metadata:{trigger:"auto"|"manual", pre_tokens:<int>}, uuid,
  #    session_id}. Marked synthetic per docs/CHECKLISTS.md fixture rule.
  signals/compact-boundary.jsonl:
    source: synthetic
  # SYNTHETIC — modeled frame-by-frame on the live 2026-08-17 incident
  # (run-ea06645118d7): a native-session run whose org has subscription access
  # disabled emits the entitlement PROSE as a plain assistant message and again
  # as an is_error result (subtype "success"), then exits 1 — no api_retry
  # frame ever appears, so retry-signals' typed categories never fired. Since
  # A1 the parser types the non-success result's prose as a status event with
  # error_category oauth_org_not_allowed; since A3 the result prose itself
  # also rides a status event (non_success_result), never a message — a failed
  # result's prose is failure evidence, not answer material.
  # The raw vendor stream was not captured (the daemon stored only normalized
  # events), hence synthetic per the docs/CHECKLISTS.md fixture rule.
  signals/org-disabled-subscription.jsonl:
    source: synthetic
  # LIVE INPUT — the native stdin queue fold (claude 2.1.283, live
  # subscription, model sonnet, recorded 2026-09-26 THROUGH the production
  # adapter path: createClaudeAdapter -> runClaude -> runCliHarness with the
  # adapter's own argv, the live-input owner writing the message through
  # `message()`). DIRECTIONAL wire recordings like protocol/: every
  # `client->cli` frame (the initialize handshake, the initial prompt, the live
  # message) sits at the exact position it was written, every `cli->client`
  # frame is the CLI's raw stdout in order. live-input-fixtures.test.ts replays
  # them 1:1 through the real adapter against a fake CLI that releases each
  # recorded stdin frame only once the adapter wrote it.
  # Sanitized: session ids, uuids (message/lifecycle/result uuids stay
  # consistent across frames), message/tool-use/request ids, the thinking
  # signature, the account block and pid of the initialize answer, the
  # environment fingerprint (tools / slash commands / skills / agents / plugins
  # / memory, scratchpad, socket and output-style paths, cwd), rate-limit
  # utilization and reset instants, the request wall clock. Usage, cost and
  # duration numbers are the recording's own.
  #
  # A live message written while the FIRST Bash step ran (queued within 1 ms)
  # was consumed inside the same turn right after that tool batch: replay echo
  # + `started`, the model ran step 2 and answered with MANGO in its report,
  # `completed` preceded the ONE result whose user_message_uuids lists both
  # the prompt and the message. Foreground Bash emits system/task_started with
  # is_backgrounded:false (never a hold).
  stream-json/recorded-live-fold-2.1.283.jsonl:
    source: recorded
    cli_version: "2.1.283"
    recorded_at: "2026-09-26"
    capture: "live subscription; production adapter path; two Bash steps (python3 time.sleep 12 s, then 3 s); live message written 1.5 s after the first tool_call"
    sanitized: "ids, signature, account, environment fingerprint, paths, rate-limit telemetry"
    expectations:
      final_messages: 1
      final_source: "result"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      tool_error_results: 0
      typed_rate_limit: false
  # A live message written while the model composed its FINAL text (after the
  # only tool result) stayed queued through result#1 (user_message_uuids lists
  # only the prompt) and ran as the NEXT native turn of the same process with
  # stdin held open: `started`, a second system/init, the replay echo, the
  # MANGO answer and result#2 (user_message_uuids = the message), then exit 0
  # once the adapter closed stdin. total_cost_usd is cumulative across the two
  # results (0.0963518 then 0.114749): the adapter emits the second usage as
  # the delta.
  stream-json/recorded-live-final-text-2.1.283.jsonl:
    source: recorded
    cli_version: "2.1.283"
    recorded_at: "2026-09-26"
    capture: "live subscription; production adapter path; Bash echo + a long essay as the final report; live message written 1.5 s after the tool_result"
    sanitized: "ids, signature, account, environment fingerprint, paths, rate-limit telemetry"
    expectations:
      final_messages: 2
      final_source: "result"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      tool_error_results: 0
      typed_rate_limit: false
