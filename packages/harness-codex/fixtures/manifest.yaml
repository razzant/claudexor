# Fixture provenance manifest. Every stream fixture declares its
# source; recorded fixtures carry the vendor CLI version they were captured
# from so scripts/fixture-freshness-check.mjs can warn when the installed CLI
# has moved on (stale recordings are a freshness smell, not a build breaker).
#
# `expectations` (W3.8) are the STREAM SEMANTICS the conformance test asserts
# through core streamExpectationViolations. Codex has NO typed final marker on
# the wire: the adapter finalizes the turn's last agent_message on
# turn.completed (requires the CodexParseState the run loop passes).
#
# The pinned-CLI model catalog capture is models-0.156.1.json (not listed
# below: this manifest covers stream fixtures). The stream recordings here keep
# their own 0.153.3 stamps because that is the CLI that produced those bytes —
# a recording is never relabelled to match a newer pin, so the freshness gate
# reports honest drift until each one is re-captured.
#
# `started_events: 1` pins the run-boundary dedup: every fixture here — the
# recorded 0.153.3 stream included — carries codex's native
# `thread.started` + `turn.started` PAIR for one run, and the adapter must
# collapse that pair to exactly one normalized `started` (turn.started stays a
# fallback for a partial stream that omits the thread frame).
cli: codex
fixtures:
  recorded-astra-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-05"
    sanitized: "thread_id; file content and prompt were synthetic public smoke data"
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  basic-run.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  plan-progress-todo-list.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  recorded-real-cli.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-05"
    sanitized: "thread_id; command and file content were synthetic public smoke data"
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  # Live `codex exec --json` capture with tools.update_plan.enabled=true.
  # The 0.153.3 native tool is opt-in. It starts with the pending list, updates
  # it to completed, then repeats the completed snapshot at turn finalization.
  # The parser suppresses that duplicate; parse.test.ts retains regression
  # coverage for the older empty-list start.
  recorded-plan-progress-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-05"
    sanitized: "thread_id"
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  session-resume-rate-limit.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: true
  # D-16 / codex #19816: `--output-schema` constrains INTERMEDIATE agent
  # messages too, so each mid-run narration arrives as a raw
  # `{work_report, output}` envelope (owner dogfood: the raw envelope streamed
  # into the PROGRESS bubble before the final answer). The parser unwraps the
  # envelope to its `output` (or suppresses a non-string one) for the VISIBLE
  # stream when the run armed the envelope (CodexParseState.envelopeActive);
  # the FINAL message keeps the raw envelope so the orchestrator's unwrap runs
  # unchanged. This conformance loop runs WITHOUT envelopeActive, so the raw
  # envelope messages pass through as ordinary text here — the unwrap/suppress
  # behavior is asserted in parse.test.ts. Output values are Russian to mirror
  # the live dogfood capture.
  structured-envelope-intermediate.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  # D-16 OVERSIZED-INPUT EVIDENCE (live, codex-cli 0.153.3, 2026-09-05).
  # Lives in context/ (NOT top-level) because the top-level conformance loop
  # asserts tool_call/tool_result/usage on every fixture and this capture has
  # NONE of those — it is a terminal-shape probe, not a normal run. No
  # `expectations` block: the subdir file is not consumed by the conformance
  # loop, only by the freshness/provenance gate.
  #
  # A 1048577-character stdin prompt fails `turn/start` before model execution
  # with JSON-RPC code -32602 and `input_error_code: input_too_large`.
  # This char cap is distinct from token-window exhaustion. The error remains
  # OUT-OF-BAND on stderr: `--json` stdout carries only `thread.started`, and
  # the CLI exits 1. The sibling .stderr.txt preserves the verbatim terminal.
  # This capture proves only the oversized-input shape, not the absence of
  # other context-exhaustion signals.
  # thread_id neutralized to a placeholder (not sensitive; sanitized for
  # determinism, matching the claude fixtures' id policy).
  context/exec-oversized-input.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-05"
    sanitized: "thread_id"
    terminal_out_of_band: "stderr (see exec-oversized-input.stderr.txt): turn/start failed, JSON-RPC code -32602, input_error_code=input_too_large, max_chars=1048576"
  # Exact 0.153.3 native error frame recorded against an auth-free loopback
  # Responses endpoint that accepts the SSE request and leaves it idle.
  # stream_idle_timeout_ms=100 and stream_max_retries=5 produce all five
  # reconnect notices before a terminal failure; this is the fourth notice.
  # Stored below the complete-run roster because it is a one-frame signal
  # probe. Historical request-timed-out wording remains in parse.test.ts.
  signals/reconnect-timeout.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-05"
    sanitized: "none"
  # SESSION-ROLLOUT records (`$CODEX_HOME/sessions/.../rollout-*.jsonl`), not
  # `--json` stream captures: the post-terminal side channel the adapter reads
  # for codex's OWN typed failure of a turn it ended with an error
  # (`event_msg` / `task_complete` / `error.codex_error_info`), which the stream
  # reduces to a sentence. They live in rollout/ (NOT top-level) because the
  # conformance loop parses top-level files as stream fixtures; no
  # `expectations` block. Consumed by transcript.test.ts and
  # vendor-failure.test.ts. Reduced to the turn markers the reader binds to:
  # every prompt, instruction, tool-output, world-state and cwd line was
  # dropped, and the remaining lines keep only ids, numbers, the model name and
  # the vendor's own error record.
  rollout/recorded-server-overloaded-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-15"
    sanitized: "thread_id and turn_id placeholders; session_meta reduced to id/cli_version/timestamp; turn_context to turn_id/model; token_count to numeric windows; all prompt/tool/world-state lines dropped"
  rollout/recorded-usage-limit-exceeded-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-12"
    sanitized: "thread_id and turn_id placeholders; session_meta reduced to id/cli_version/timestamp; turn_context to turn_id/model; token_count to numeric windows; all prompt/tool/world-state lines dropped"
  # A code Claudexor knows nothing about (`other`): pins "no mapping table".
  rollout/recorded-other-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-16"
    sanitized: "thread_id and turn_id placeholders; the request id inside the vendor message zeroed; session_meta reduced to id/cli_version/timestamp; turn_context to turn_id/model; token_count to numeric windows; all prompt/tool/world-state lines dropped"
  # A RESUMED session: one successful turn, then a second turn the vendor ended
  # with `server_overloaded`. Pins "the LAST turn speaks".
  rollout/recorded-resumed-overloaded-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-20"
    sanitized: "thread_id and turn_id placeholders; last_agent_message replaced; session_meta reduced to id/cli_version/timestamp; turn_context to turn_id/model; token_count to numbers; all prompt/tool/reasoning/world-state lines dropped"
