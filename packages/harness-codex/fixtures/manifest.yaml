# Fixture provenance manifest. Every stream fixture declares its
# source; recorded fixtures carry the vendor CLI version they were captured
# from so scripts/fixture-freshness-check.mjs can warn when the installed CLI
# has moved on (stale recordings are a freshness smell, not a build breaker).
#
# `expectations` (W3.8) are the STREAM SEMANTICS the conformance test asserts
# through core streamExpectationViolations. Codex has NO typed final marker on
# the wire: the adapter finalizes the turn's last agent_message on
# turn.completed (requires the CodexParseState the run loop passes).
#
# `started_events: 1` pins the run-boundary dedup: every fixture here — the
# recorded 0.153.3 stream included — carries codex's native
# `thread.started` + `turn.started` PAIR for one run, and the adapter must
# collapse that pair to exactly one normalized `started` (turn.started stays a
# fallback for a partial stream that omits the thread frame).
#
# Codex 0.156.1 pin (2026-09-24): only the credential-free loopback probes
# (context/exec-oversized-input, signals/reconnect-timeout) were re-recorded
# from 0.156.1; the committed files are byte-identical to their 0.153.3
# captures (0.156.1 also printed a stderr warning about the recorder's temp-dir
# CODEX_HOME, an environment note outside the terminal, not kept). The live
# account runs (recorded-astra, recorded-real-cli, recorded-plan-progress) and
# the real vendor-failure rollouts need a paid run or a real vendor incident,
# so they were NOT re-recorded and keep the version they were captured from.
cli: codex
fixtures:
  # Credential-free loopback probe:1048576 scalars accepted,1048577 rejected
  # before any provider request. This does not establish a model token window.
  app-server/input-too-large-0.162.1.jsonl:
    source: recorded
    cli_version: "0.162.1"
    recorded_at: "2026-10-14"
    sanitized: "JSON-RPC error object only; unchanged code, message and data"
  # Actual native notifications from auth-free loopback Responses endpoints:
  # an idle SSE stream and HTTP 403, captured on macOS (not the original Windows incident).
  app-server/retry-status-0.156.1.jsonl:
    source: recorded
    cli_version: "0.156.1"
    recorded_at: "2026-10-02"
    sanitized: "thread/turn ids and loopback port; emittedAtMs omitted; native error fields unchanged"
  # Native turn/start RPC refusal from an auth-free loopback probe; zero provider calls.
  app-server/input-too-large-error.jsonl:
    source: recorded
    cli_version: "0.156.1"
    recorded_at: "2026-09-30"
    sanitized: "JSON-RPC error object only; unchanged code, message and data"
  # LIVE MESSAGE (`turn/steer`) capture taken THROUGH the adapter's own
  # transport (runCodexAppServer + CodexAppServerController.steer) on codex-cli
  # 0.156.1, 2026-09-26, model gpt-6-astra, effort low, read-only sandbox. The
  # task asked for twelve sequential `sleep 3; echo STEP_N` commands; when the
  # third command started the adapter sent `turn/steer` (request id 4,
  # clientUserMessageId=live-message-fixture). The server answered `{turnId}`
  # (= accepted) and 2.9 s later echoed the message as a `userMessage` item
  # carrying that clientId (= delivered); the model answered MANGO and steps
  # 4..12 never ran. Request ids 1..7 are the adapter's own (initialize,
  # thread/start, turn/start, turn/steer, thread/read, thread/goal/get,
  # thread/backgroundTerminals/list), so conformance.test.ts replays the file
  # 1:1 through runCodexAppServer. Every raw stdout frame is kept in order.
  app-server/recorded-steer-0.156.1.jsonl:
    source: recorded
    cli_version: "0.156.1"
    recorded_at: "2026-09-26"
    sanitized: "thread, turn, item and process ids; cwd, codexHome and rollout paths; hostname and installation id; account plan and rate-limit payloads; token counts; timestamps"
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      tool_error_results: 0
      typed_rate_limit: false
  # MULTI-AGENT stream, synthetic, shaped after a live incident on codex-cli
  # 0.156.1 (proactive multi-agent mode, 2026-10-04): the root thread spawned a
  # sub-agent whose thread emits its own `turn/started`, items, token usage and
  # `turn/completed` on the SAME stdio stream. The child settles FIRST with the
  # text `[]\nNO_FINDINGS` (and a failed command), the root keeps working and
  # ends with its valid `{work_report, output}` envelope. Frame shapes follow
  # recorded-steer-0.156.1.jsonl; request ids 1..6 are the adapter's own
  # (initialize, thread/start, turn/start, thread/read, thread/goal/get,
  # thread/backgroundTerminals/list), so conformance.test.ts replays the file
  # 1:1 through runCodexAppServer. Pins root-thread ownership of finality: the
  # final is the root envelope, `completed.native_turn_id` is the root turn, the
  # child's command failure and text are timeline evidence only, and the
  # child's tokens stay in the usage total.
  app-server/synthetic-multi-agent-0.156.1.jsonl:
    source: synthetic
  # BROWSER MCP stream, synthetic (claudexor#215), written before the recorded
  # stream below existed; it keeps the failed-call and close shapes that one
  # lacks. The `mcpToolCall` items follow the schema
  # generated by codex-cli 0.162.1 (`app-server generate-json-schema`) and
  # its `McpToolCallEndEvent` mapping: `completed` only for a result without
  # `isError`, `failed` for an `isError` result (kept in `result`) or an
  # `error.message`. Every result `content` text is the REAL output of the
  # pinned @playwright/mcp 0.0.83 (headless, isolated) for a one-use loopback
  # probe page, captured 2026-10-29 without a model or account; only the
  # snapshot file link was rewritten to the run-artifact layout. Request ids
  # 1..6 are the adapter's own, so conformance.test.ts replays it 1:1 through
  # runCodexAppServer.
  app-server/synthetic-browser-mcp-0.162.1.jsonl:
    source: synthetic
  # A REAL Browser run (claudexor#215), every stdout frame in order, captured
  # through runCodexAppServer without an account: codex-cli 0.162.1, the pinned
  # @playwright/mcp 0.0.83 launcher with its start delayed 5 s, real headless
  # Chrome, one-use loopback page, and a local scripted Responses provider
  # standing in for the model (so token counts and the model's words are scripted;
  # the tool calls and results are real). Browser reports `starting`, then `ready`;
  # `turn/start` follows `ready`, and the only MCP item is the nested
  # `browser_navigate` of a code-mode `exec`. This proves stream shapes and tool
  # exposure, not a real model or login. Ids 1..6 are the adapter's own.
  app-server/recorded-browser-delayed-start-0.162.1.jsonl:
    source: recorded
    cli_version: "0.162.1"
    recorded_at: "2026-11-03"
    sanitized: "thread, turn and item ids; installation id; run root paths; host name; clock fields; emittedAtMs omitted; snapshot file name"
  # NATIVE WARNINGS stream, synthetic (claudexor#337): one readonly text-only
  # run. Frame layouts follow a real codex-cli 0.162.1 macOS loopback capture
  # (ids, paths, host and timestamps neutralized, emittedAtMs omitted). Warning
  # params follow `ConfigWarningNotification`/`WarningNotification` generated
  # by 0.162.1 `app-server generate-json-schema`, byte-identical to 0.153.3.
  # Texts at rust-v0.162.1: the configWarning is bubblewrap's user-namespace
  # check (sandboxing/src/bwrap.rs, app-server/src/lib.rs), sent after
  # `initialize` and before the remote-control status; the null-thread
  # warning is log_write_warning.rs; the thread warning keeps the recorded
  # model-metadata format with a neutral slug. No Linux host was recorded. Ids
  # 1..6 are the adapter's own, so it replays 1:1 through runCodexAppServer.
  app-server/synthetic-native-warnings-0.162.1.jsonl:
    source: synthetic
  app-server/recorded-run-0.156.1.jsonl:
    source: recorded
    cli_version: "0.156.1"
    recorded_at: "2026-09-25"
    sanitized: "thread, turn, item and process ids; cwd; timestamps"
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 2
      started_events: 1
      delta_messages: 0
      tool_error_results: 0
      typed_rate_limit: false
  recorded-astra-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-05"
    sanitized: "thread_id; file content and prompt were synthetic public smoke data"
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  # Its file_change frame is a synthetic native-format example: no live Codex
  # edit has been captured, so it pins the parser shape, never vendor behavior.
  basic-run.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  plan-progress-todo-list.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  recorded-real-cli.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-05"
    sanitized: "thread_id; command and file content were synthetic public smoke data"
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  # Live `codex exec --json` capture with tools.update_plan.enabled=true.
  # The 0.153.3 native tool is opt-in. It starts with the pending list, updates
  # it to completed, then repeats the completed snapshot at turn finalization.
  # The parser suppresses that duplicate; parse.test.ts retains regression
  # coverage for the older empty-list start.
  recorded-plan-progress-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-05"
    sanitized: "thread_id"
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  session-resume-rate-limit.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: true
  # D-16 / codex #19816: `--output-schema` constrains INTERMEDIATE agent
  # messages too, so each mid-run narration arrives as a raw
  # `{work_report, output}` envelope (owner dogfood: the raw envelope streamed
  # into the PROGRESS bubble before the final answer). The parser unwraps the
  # envelope to its `output` (or suppresses a non-string one) for the VISIBLE
  # stream when the run armed the envelope (CodexParseState.envelopeActive);
  # the FINAL message keeps the raw envelope so the orchestrator's unwrap runs
  # unchanged. This conformance loop runs WITHOUT envelopeActive, so the raw
  # envelope messages pass through as ordinary text here — the unwrap/suppress
  # behavior is asserted in parse.test.ts. Output values are Russian to mirror
  # the live dogfood capture.
  structured-envelope-intermediate.jsonl:
    source: synthetic
    expectations:
      final_messages: 1
      final_source: "last_agent_message"
      final_is_last_message: true
      thinking_events: 0
      started_events: 1
      delta_messages: 0
      typed_rate_limit: false
  # D-16 OVERSIZED-INPUT EVIDENCE (codex-cli 0.153.3 live 2026-09-05; re-recorded
  # from 0.156.1 on 2026-09-24 without credentials against a loopback provider
  # that received zero requests — the input check runs before any request).
  # Lives in context/ (NOT top-level) because the top-level conformance loop
  # asserts tool_call/tool_result/usage on every fixture and this capture has
  # NONE of those — it is a terminal-shape probe, not a normal run. No
  # `expectations` block: the subdir file is not consumed by the conformance
  # loop, only by the freshness/provenance gate.
  #
  # A 1048577-character stdin prompt fails `turn/start` before model execution
  # with JSON-RPC code -32602 and `input_error_code: input_too_large`.
  # This char cap is distinct from token-window exhaustion. The error remains
  # OUT-OF-BAND on stderr: `--json` stdout carries only `thread.started`, and
  # the CLI exits 1. The sibling .stderr.txt preserves the verbatim terminal.
  # This capture proves only the oversized-input shape, not the absence of
  # other context-exhaustion signals.
  # thread_id neutralized to a placeholder (not sensitive; sanitized for
  # determinism, matching the claude fixtures' id policy).
  context/exec-oversized-input.jsonl:
    source: recorded
    cli_version: "0.156.1"
    recorded_at: "2026-09-24"
    sanitized: "thread_id"
    terminal_out_of_band: "stderr (see exec-oversized-input.stderr.txt): turn/start failed, JSON-RPC code -32602, input_error_code=input_too_large, max_chars=1048576"
  # Exact native error frame (byte-identical in 0.153.3 and 0.156.1) recorded
  # against an auth-free loopback Responses endpoint that accepts the SSE
  # request and leaves it idle.
  # stream_idle_timeout_ms=100 and stream_max_retries=5 produce all five
  # reconnect notices before a terminal failure; this is the fourth notice.
  # Stored below the complete-run roster because it is a one-frame signal
  # probe. Historical request-timed-out wording remains in parse.test.ts.
  signals/reconnect-timeout.jsonl:
    source: recorded
    cli_version: "0.156.1"
    recorded_at: "2026-09-24"
    sanitized: "none"
  # SESSION-ROLLOUT records (`$CODEX_HOME/sessions/.../rollout-*.jsonl`), not
  # `--json` stream captures: the post-terminal side channel the adapter reads
  # for codex's OWN typed failure of a turn it ended with an error
  # (`event_msg` / `task_complete` / `error.codex_error_info`), which the stream
  # reduces to a sentence. They live in rollout/ (NOT top-level) because the
  # conformance loop parses top-level files as stream fixtures; no
  # `expectations` block. Consumed by transcript.test.ts and
  # vendor-failure.test.ts. Reduced to the turn markers the reader binds to:
  # every prompt, instruction, tool-output, world-state and cwd line was
  # dropped, and the remaining lines keep only ids, numbers, the model name and
  # the vendor's own error record.
  rollout/recorded-server-overloaded-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-15"
    sanitized: "thread_id and turn_id placeholders; session_meta reduced to id/cli_version/timestamp; turn_context to turn_id/model; token_count to numeric windows; all prompt/tool/world-state lines dropped"
  rollout/recorded-usage-limit-exceeded-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-12"
    sanitized: "thread_id and turn_id placeholders; session_meta reduced to id/cli_version/timestamp; turn_context to turn_id/model; token_count to numeric windows; all prompt/tool/world-state lines dropped"
  # A code Claudexor knows nothing about (`other`): pins "no mapping table".
  rollout/recorded-other-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-16"
    sanitized: "thread_id and turn_id placeholders; the request id inside the vendor message zeroed; session_meta reduced to id/cli_version/timestamp; turn_context to turn_id/model; token_count to numeric windows; all prompt/tool/world-state lines dropped"
  # A RESUMED session: one successful turn, then a second turn the vendor ended
  # with `server_overloaded`. Pins "the LAST turn speaks".
  rollout/recorded-resumed-overloaded-0.153.3.jsonl:
    source: recorded
    cli_version: "0.153.3"
    recorded_at: "2026-09-20"
    sanitized: "thread_id and turn_id placeholders; last_agent_message replaced; session_meta reduced to id/cli_version/timestamp; turn_context to turn_id/model; token_count to numbers; all prompt/tool/reasoning/world-state lines dropped"
